name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: signaldock-linux-x64
            archive_ext: .tar.gz

          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: signaldock-darwin-x64
            archive_ext: .tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: signaldock-darwin-arm64
            archive_ext: .tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: signaldock-windows-x64
            archive_ext: .zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y musl-tools pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/signaldock dist/signaldock
          chmod +x dist/signaldock
          tar -czf ${{ matrix.artifact_name }}${{ matrix.archive_ext }} -C dist signaldock

      - name: Prepare archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/signaldock.exe dist/signaldock.exe
          Compress-Archive -Path dist/signaldock.exe -DestinationPath ${{ matrix.artifact_name }}${{ matrix.archive_ext }} -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            signaldock-linux-x64.tar.gz
            signaldock-darwin-x64.tar.gz
            signaldock-darwin-arm64.tar.gz
            signaldock-windows-x64.zip
